<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ccmon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --running: #22c55e;
      --stopped: #f97316;
      --waiting: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    #status-bar {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color 0.2s;
    }

    main {
      padding: 20px;
    }

    #project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge-running  { background: rgba(34,197,94,0.12);  color: var(--running); }
    .badge-stopped  { background: rgba(249,115,22,0.12); color: var(--stopped); }
    .badge-waiting  { background: rgba(239,68,68,0.12);  color: var(--waiting); }

    .dot-running  { background: var(--running); }
    .dot-stopped  { background: var(--stopped); }
    .dot-waiting  { background: var(--waiting); }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-message {
      font-size: 12px;
      font-style: italic;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      font-size: 11px;
      color: var(--muted);
      margin-top: auto;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ccmon</h1>
    <div id="status-bar">Connecting...</div>
  </header>
  <main>
    <div id="project-grid"></div>
  </main>
  <script>
    const state = new Map(); // source → ProjectState[]

    const stateLabel = {
      running: 'Running',
      stopped: 'Stopped',
      waiting_for_permission: 'Waiting',
    };

    const stateColor = {
      running: '#22c55e',
      stopped: '#f97316',
      waiting_for_permission: '#ef4444',
    };

    const stateBadgeClass = {
      running: 'badge-running',
      stopped: 'badge-stopped',
      waiting_for_permission: 'badge-waiting',
    };

    const stateDotClass = {
      running: 'dot-running',
      stopped: 'dot-stopped',
      waiting_for_permission: 'dot-waiting',
    };

    function relativeTime(iso) {
      if (!iso) return '';
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function truncate(str, max) {
      if (!str) return '';
      return str.length > max ? str.slice(0, max) + '…' : str;
    }

    function createCard(proj) {
      const card = document.createElement('div');
      card.className = 'card';

      const s = proj.state || 'stopped';
      const badgeClass = stateBadgeClass[s] || 'badge-stopped';
      const dotClass = stateDotClass[s] || 'dot-stopped';
      const label = stateLabel[s] || s;

      let html = `
        <div class="card-header">
          <span class="card-name" title="${esc(proj.projectName)}">${esc(proj.projectName)}</span>
          <span class="badge ${badgeClass}">
            <span class="dot ${dotClass}"></span>
            ${esc(label)}
          </span>
        </div>
      `;

      // git branch
      if (proj.gitBranch) {
        html += `<div class="card-meta">branch: ${esc(proj.gitBranch)}</div>`;
      }

      // latest user message
      if (proj.latestUserMessage) {
        html += `<div class="card-message">${esc(truncate(proj.latestUserMessage, 80))}</div>`;
      }

      // model + last tool use
      if (proj.model || proj.lastToolUse) {
        const parts = [proj.model, proj.lastToolUse].filter(Boolean);
        html += `<div class="card-meta">${esc(parts.join(' · '))}</div>`;
      }

      // subagent count
      if (proj.subagentCount && proj.subagentCount > 0) {
        html += `<div class="card-meta">⬡ ${esc(proj.subagentCount)} sub-agent${proj.subagentCount !== 1 ? 's' : ''}</div>`;
      }

      // last updated (always shown at bottom)
      const rel = relativeTime(proj.lastUpdated);
      html += `<div class="card-footer">${rel ? esc(rel) : '—'}</div>`;

      card.innerHTML = html;
      return card;
    }

    function render() {
      const grid = document.getElementById('project-grid');
      const all = [...state.values()].flat();
      all.sort((a, b) => a.projectName.localeCompare(b.projectName));
      grid.innerHTML = '';

      if (all.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No active projects';
        grid.appendChild(empty);
        return;
      }

      for (const proj of all) {
        grid.appendChild(createCard(proj));
      }
    }

    function setStatus(s) {
      const bar = document.getElementById('status-bar');
      bar.textContent = s === 'connected' ? '● Connected' : '⟳ Reconnecting...';
      bar.style.color = s === 'connected' ? '#22c55e' : '#f97316';
    }

    let backoff = 1000;

    function connectWebSocket() {
      const ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = () => {
        backoff = 1000;
        setStatus('connected');
      };

      ws.onmessage = (e) => {
        state.set('local', JSON.parse(e.data));
        render();
      };

      ws.onclose = ws.onerror = () => {
        setStatus('reconnecting');
        setTimeout(connectWebSocket, backoff);
        backoff = Math.min(backoff * 2, 30000);
      };
    }

    connectWebSocket();
  </script>
</body>
</html>
