<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ccmon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --running: #22c55e;
      --stopped: #f97316;
      --waiting: #ef4444;
      --closed: #6b7280;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    #status-bar {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color 0.2s;
      cursor: pointer;
      user-select: none;
    }

    #status-bar:hover {
      background: rgba(255,255,255,0.08);
    }

    #settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    #settings-btn:hover {
      background: rgba(255,255,255,0.10);
      color: var(--text);
    }

    #backend-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      padding: 8px 0;
    }

    #backend-menu.open {
      display: block;
    }

    .menu-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 14px 4px;
    }

    .backend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
    }

    .backend-info {
      flex: 1;
      min-width: 0;
    }

    .backend-host {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backend-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backend-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot-connected    { background: var(--running); }
    .status-dot-connecting   { background: var(--stopped); }
    .status-dot-disconnected { background: var(--waiting); }

    .status-label-connected    { color: var(--running); }
    .status-label-connecting   { color: var(--stopped); }
    .status-label-disconnected { color: var(--muted); }

    .remove-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .remove-btn:hover:not(:disabled) {
      background: rgba(239,68,68,0.12);
      color: var(--waiting);
      border-color: var(--waiting);
    }

    .remove-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .menu-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }

    .add-server-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
    }

    #add-server-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    #add-server-input:focus {
      border-color: var(--muted);
    }

    #add-server-input::placeholder {
      color: var(--muted);
    }

    #add-server-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    #add-server-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    #add-server-error {
      font-size: 11px;
      color: var(--waiting);
      padding: 0 14px 6px;
      display: none;
    }

    main {
      padding: 20px;
    }

    #project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      max-width: 400px;
    }

    .card-agents {
      overflow: hidden;
      max-height: 300px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge-running  { background: rgba(34,197,94,0.12);  color: var(--running); }
    .badge-stopped  { background: rgba(249,115,22,0.12); color: var(--stopped); }
    .badge-waiting  { background: rgba(239,68,68,0.12);  color: var(--waiting); }
    .badge-closed   { background: rgba(107,114,128,0.12); color: var(--closed); border: 1px solid rgba(107,114,128,0.18); }

    .badge-source {
      background: rgba(148,163,184,0.08);
      color: #64748b;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 9999px;
      border: 1px solid rgba(148,163,184,0.12);
      flex-shrink: 0;
    }

    .dot-running  { background: var(--running); animation: pulse-dot 1.8s ease-in-out infinite; }
    .dot-stopped  { background: var(--stopped); }
    .dot-waiting  { background: var(--waiting); }
    .dot-closed   { background: var(--closed); }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-message {
      font-size: 12px;
      font-style: italic;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0.5rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.75); }
    }

    @keyframes flash-waiting {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--waiting); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    }
    .card-flashing-waiting {
      animation: flash-waiting 1s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes flash-error {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--waiting); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    }
    .card-flashing-error {
      animation: flash-error 1s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes flash-stopped {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--stopped); box-shadow: 0 0 12px rgba(249,115,22,0.5); }
    }
    .card-flashing-stopped {
      animation: flash-stopped 0.5s ease-in-out 10;
    }

    @keyframes flash-notification {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.45); }
    }
    .card-flashing-notification {
      animation: flash-notification 0.5s ease-in-out 10;
    }

    /* Context window progress bar */
    .ctx-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .ctx-bar-container {
      width: 120px;
      flex-shrink: 0;
    }
    .ctx-bar {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }
    .ctx-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--running);
      transition: width 0.3s ease;
    }
    .ctx-fill-warn  { background: #f59e0b; }
    .ctx-fill-danger { background: var(--waiting); }
    .ctx-label {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .ctx-tasks {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Unified agent row */
    .agent-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-dot-active {
      background: var(--running);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    .agent-dot-idle {
      background: var(--muted);
      opacity: 0.5;
    }
    .agent-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .agent-model {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .agent-msg {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 13px;
    }
    .agent-msg-in  { color: #7dd3fc; }
    .agent-msg-out { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>ccmon</h1>
    <div id="header-right">
      <div id="status-bar">Connecting...</div>
      <div id="settings-btn" title="Manage servers">⚙</div>
      <div id="backend-menu">
        <div class="menu-section-label">Backends</div>
        <div id="backend-list"></div>
        <div class="menu-divider"></div>
        <div class="add-server-row">
          <input id="add-server-input" type="text" placeholder="ws://host:port/ws" />
          <button id="add-server-btn">Add</button>
        </div>
        <div id="add-server-error"></div>
      </div>
    </div>
  </header>
  <main>
    <div id="project-grid"></div>
  </main>
  <script>
    const stateLabel = {
      running: 'Running',
      stopped: 'Stopped',
      waiting_for_permission: 'Waiting',
      error: 'Error',
      closed: 'Closed',
    };

    const _stateColor = {
      running: '#22c55e',
      stopped: '#f97316',
      waiting_for_permission: '#ef4444',
      error: '#ef4444',
      closed: '#6b7280',
    };

    const stateBadgeClass = {
      running: 'badge-running',
      stopped: 'badge-stopped',
      waiting_for_permission: 'badge-waiting',
      error: 'badge-waiting',
      closed: 'badge-closed',
    };

    const stateDotClass = {
      running: 'dot-running',
      stopped: 'dot-stopped',
      waiting_for_permission: 'dot-waiting',
      error: 'dot-waiting',
      closed: 'dot-closed',
    };

    function _relativeTime(iso) {
      if (!iso) return '';
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function truncate(str, max) {
      if (!str) return '';
      return str.length > max ? `${str.slice(0, max)}…` : str;
    }

    function shortModel(model) {
      if (!model) return '';
      const m = model.toLowerCase();
      if (m.includes('opus'))   return 'Opus';
      if (m.includes('sonnet')) return 'Sonnet';
      if (m.includes('haiku'))  return 'Haiku';
      return model;
    }

    function _fmtTokens(n) {
      if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
      if (n >= 1000) return `${(n / 1000).toFixed(1)}K`;
      return String(n);
    }

    function renderContextBar(inputTokens, tasksDone, tasksTotal) {
      const MAX_CTX = 128_000;
      const tokens = inputTokens || 0;
      const pct = Math.min(100, Math.round((tokens / MAX_CTX) * 100));
      const fillClass = tokens > 120_000 ? 'ctx-fill ctx-fill-danger'
        : tokens > 100_000 ? 'ctx-fill ctx-fill-warn'
        : 'ctx-fill';
      const label = tokens >= 1000 ? `${Math.round(tokens / 1000)}k` : String(tokens);
      const tasksHtml = tasksTotal > 0
        ? `<span class="ctx-tasks">📋 ${tasksDone}/${tasksTotal}</span>`
        : '';
      return `
        <div class="ctx-row">
          <span>💭</span>
          <div class="ctx-bar-container">
            <div class="ctx-bar">
              <div class="${fillClass}" style="width:${pct}%"></div>
            </div>
          </div>
          <span class="ctx-label">${esc(label)}</span>
          ${tasksHtml}
        </div>
      `;
    }

    function renderAgentRow({ label, model, userActivity, assistantActivity, isActive }) {
      const dotClass = isActive ? 'agent-dot agent-dot-active' : 'agent-dot agent-dot-idle';
      const modelHtml = model
        ? `<span class="agent-model">🤖 ${esc(shortModel(model))}</span>`
        : '';
      let userHtml = '';
      if (userActivity?.text) {
        userHtml = `<div class="agent-msg agent-msg-in">▶ ${esc(truncate(userActivity.text, 80))}</div>`;
      }
      let assistantHtml = '';
      if (assistantActivity) {
        const actText = assistantActivity.text ?? assistantActivity.tool;
        if (actText) {
          assistantHtml = `<div class="agent-msg agent-msg-out">◀ ${esc(truncate(actText, 80))}</div>`;
        }
      }
      return `
        <div class="agent-row">
          <div class="agent-header">
            <span class="${dotClass}"></span>
            <span class="agent-label">${esc(label)}</span>
            ${modelHtml}
          </div>
          ${userHtml}
          ${assistantHtml}
        </div>
      `;
    }

    function createCard(proj, flashStopped, flashNotification, displayName, key) {
      const card = document.createElement('div');
      const s = proj.state || 'stopped';
      const isWaitingFlash = s === 'waiting_for_permission' && !flashWaitingDismissed.has(key);
      const isErrorFlash = s === 'error' && !flashErrorDismissed.has(key);
      const flashClasses = isWaitingFlash ? ' card-flashing-waiting'
        : isErrorFlash ? ' card-flashing-error'
        : flashStopped ? ' card-flashing-stopped'
        : flashNotification ? ' card-flashing-notification'
        : '';
      card.className = `card${flashClasses}`;

      if (isWaitingFlash) {
        card.addEventListener('click', () => {
          flashWaitingDismissed.add(key);
          card.classList.remove('card-flashing-waiting');
        });
      }
      if (isErrorFlash) {
        card.addEventListener('click', () => {
          flashErrorDismissed.add(key);
          card.classList.remove('card-flashing-error');
        });
      }

      const badgeClass = stateBadgeClass[s] || 'badge-stopped';
      const dotClass = stateDotClass[s] || 'dot-stopped';
      const label = stateLabel[s] || s;

      // Resolve task counts from tasks array when available, fall back to done/total fields
      let tasksDone = proj.tasksDone || 0;
      let tasksTotal = proj.tasksTotal || 0;
      if (proj.tasks && proj.tasks.length > 0) {
        const nonDeleted = proj.tasks.filter(t => t.status !== 'deleted');
        tasksDone = nonDeleted.filter(t => t.status === 'completed').length;
        tasksTotal = nonDeleted.length;
      }

      const cardName = displayName || proj.projectName;
      const sessionSuffix = proj.sessionName
        ? ` <span style="font-weight:normal;color:var(--muted)">(${esc(proj.sessionName)})</span>`
        : '';
      const sourceLabel = (proj.source === "opencode") ? "OC" : "CC";
      const cardTitle = proj.sessionName ? `${cardName} (${proj.sessionName})` : cardName;
      let html = `
        <div class="card-header">
          <span class="card-name" title="${esc(cardTitle)}">${esc(cardName)}${sessionSuffix}</span>
          <div class="card-pills">
            <span class="badge-source">${esc(sourceLabel)}</span>
            <span class="badge ${badgeClass}">
              <span class="dot ${dotClass}"></span>
              ${esc(label)}
            </span>
          </div>
        </div>
      `;

      html += renderContextBar(proj.inputTokens || 0, tasksDone, tasksTotal);

      let agentsHtml = renderAgentRow({
        label: 'Main agent',
        model: proj.model,
        userActivity: proj.latestUserActivity,
        assistantActivity: proj.latestAssistantActivity,
        isActive: s === 'running',
      });

      if (proj.subagents && proj.subagents.length > 0) {
        for (const agent of proj.subagents) {
          const agentLabel = `Sub: ${agent.description ?? agent.slug ?? agent.agentId}`;
          agentsHtml += renderAgentRow({
            label: agentLabel,
            model: agent.model,
            userActivity: agent.latestUserActivity,
            assistantActivity: agent.latestAssistantActivity,
            isActive: agent.isActive,
          });
        }
      }

      html += `<div class="card-agents">${agentsHtml}</div>`;

      card.innerHTML = html;
      return card;
    }

    const prevState = new Map();                // projKey → last known state string
    const prevNotificationTimestamp = new Map(); // projKey → last known notificationTimestamp
    const flashStopped = new Map();             // projKey → timestamp when flash started (5s window)
    const flashNotification = new Map();        // projKey → timestamp when flash started (5s window)
    const flashWaitingDismissed = new Set();    // projKey → dismissed via click-acknowledgement
    const flashErrorDismissed = new Set();      // projKey → dismissed via click-acknowledgement

    // Composite key that uniquely identifies a project across multiple backends
    const projKey = (p) => `${p._backendKey}::${p.projectDir || p.projectName}`;

    let lastSortOrder = [];  // projKey[] — cached sort order, refreshed every 30s
    let lastSortTime = 0;    // ms timestamp of last sort

    // Returns projects sorted by lastUpdated descending, re-sorting at most every 30s.
    // Between re-sorts, new projects are prepended and the cached order is preserved.
    function getSortedProjects(projects) {
      const now = Date.now();
      if (now - lastSortTime >= 30_000) {
        const sorted = [...projects].sort((a, b) => {
          const ta = a.lastUpdated ? new Date(a.lastUpdated).getTime() : 0;
          const tb = b.lastUpdated ? new Date(b.lastUpdated).getTime() : 0;
          return tb - ta;
        });
        lastSortOrder = sorted.map(p => projKey(p));
        lastSortTime = now;
        return sorted;
      }

      // Stable pass: reorder to match cached order, prepend any new projects
      const byKey = new Map(projects.map(p => [projKey(p), p]));
      const known = lastSortOrder.filter(k => byKey.has(k)).map(k => byKey.get(k));
      const knownKeys = new Set(lastSortOrder);
      const newProjects = projects.filter(p => !knownKeys.has(projKey(p)));
      const result = [...newProjects, ...known];
      // Keep lastSortOrder in sync so new projects are anchored on next re-sort
      lastSortOrder = result.map(p => projKey(p));
      return result;
    }

    function render(projects) {
      const grid = document.getElementById('project-grid');
      const all = [...projects];

      // Compute state transitions and new notification arrivals before clearing DOM
      const now = Date.now();
      const flashWindow = 5000;
      for (const proj of all) {
        const key = projKey(proj);
        const prev = prevState.get(key);
        if (prev === 'running' && proj.state === 'stopped') {
          flashStopped.set(key, now);
        }
        // Re-enable flash if a new permission request arrives after a previous one was dismissed
        if (prev === 'waiting_for_permission' && proj.state !== 'waiting_for_permission') {
          flashWaitingDismissed.delete(key);
        }
        if (prev === 'error' && proj.state !== 'error') {
          flashErrorDismissed.delete(key);
        }
        prevState.set(key, proj.state);

        const prevTs = prevNotificationTimestamp.get(key);
        const curTs = proj.notificationTimestamp;
        if (prevTs !== undefined && curTs && curTs !== prevTs) {
          flashNotification.set(key, now);
        }
        if (curTs !== undefined) {
          prevNotificationTimestamp.set(key, curTs);
        }
      }
      // Prune entries no longer in the project list or whose flash window has expired
      const currentKeys = new Set(all.map(p => projKey(p)));
      for (const key of [...prevState.keys()]) {
        if (!currentKeys.has(key)) prevState.delete(key);
      }
      for (const key of [...prevNotificationTimestamp.keys()]) {
        if (!currentKeys.has(key)) prevNotificationTimestamp.delete(key);
      }
      for (const [key, ts] of [...flashStopped.entries()]) {
        if (!currentKeys.has(key) || now - ts >= flashWindow) flashStopped.delete(key);
      }
      for (const [key, ts] of [...flashNotification.entries()]) {
        if (!currentKeys.has(key) || now - ts >= flashWindow) flashNotification.delete(key);
      }
      for (const key of [...flashWaitingDismissed]) {
        if (!currentKeys.has(key)) flashWaitingDismissed.delete(key);
      }
      for (const key of [...flashErrorDismissed]) {
        if (!currentKeys.has(key)) flashErrorDismissed.delete(key);
      }

      grid.innerHTML = '';

      if (all.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No active projects';
        grid.appendChild(empty);
        return;
      }

      // When multiple backends share the same projectName, prefix with hostname for disambiguation
      const nameCounts = new Map();
      for (const proj of all) {
        nameCounts.set(proj.projectName, (nameCounts.get(proj.projectName) || 0) + 1);
      }

      for (const proj of all) {
        const key = projKey(proj);
        const displayName = nameCounts.get(proj.projectName) > 1
          ? `${proj._backendKey}:${proj.projectName}`
          : undefined;
        grid.appendChild(createCard(
          proj,
          flashStopped.has(key),
          flashNotification.has(key),
          displayName,
          key,
        ));
      }
    }

    // BackendManager: manages multiple WebSocket backend connections
    const BackendManager = {
      backends: [],

      init() {
        // Entry 0 is always the main server
        this.backends.push(this._createEntry(`ws://${location.host}/ws`));

        // Load additional servers from localStorage
        try {
          const saved = JSON.parse(localStorage.getItem('ccmon-backends') || '[]');
          for (const url of saved) {
            if (typeof url === 'string' && url !== this.backends[0].url) {
              this.backends.push(this._createEntry(url));
            }
          }
        } catch (_) { /* malformed localStorage entry — start fresh */ }

        for (const entry of this.backends) {
          this._connect(entry);
        }
      },

      _createEntry(url) {
        return { url, ws: null, hostname: null, status: 'connecting', projects: [], backoff: 1000, lastMessageAt: Date.now() };
      },

      _connect(entry) {
        entry.status = 'connecting';
        updateStatusPill();
        updateBackendMenu();

        try {
          const ws = new WebSocket(entry.url);
          entry.ws = ws;

          ws.onopen = () => {
            entry.backoff = 1000;
            entry.status = 'connected';
            // Clear stale projects so the brief window before the server's first message
            // doesn't show data from the previous connection.
            entry.projects = [];
            updateStatusPill();
            updateBackendMenu();
          };

          ws.onmessage = (e) => {
            entry.lastMessageAt = Date.now();
            try {
              const data = JSON.parse(e.data);
              // Support both new { hostname, projects } envelope and legacy raw array
              if (Array.isArray(data)) {
                entry.projects = data;
              } else {
                if (data.hostname) entry.hostname = data.hostname;
                entry.projects = data.projects || [];
              }
              mergeAndRender();
            } catch (err) {
              console.error('Failed to parse WebSocket message:', err);
            }
          };

          ws.onclose = ws.onerror = () => {
            if (entry.ws !== ws) return; // superseded by a later connection attempt
            entry.status = 'disconnected';
            entry.projects = [];
            mergeAndRender();
            updateStatusPill();
            updateBackendMenu();
            const delay = entry.backoff;
            entry.backoff = Math.min(entry.backoff * 2, 30000);
            setTimeout(() => {
              if (this.backends.includes(entry)) {
                this._connect(entry);
              }
            }, delay);
          };
        } catch (err) {
          entry.status = 'disconnected';
          updateStatusPill();
          updateBackendMenu();
        }
      },

      addBackend(url) {
        const entry = this._createEntry(url);
        this.backends.push(entry);
        this._saveExtras();
        this._connect(entry);
        updateBackendMenu();
      },

      removeBackend(index) {
        if (index === 0) return; // main server cannot be removed
        const entry = this.backends[index];
        if (entry.ws) {
          entry.ws.onclose = entry.ws.onerror = null;
          entry.ws.close();
          entry.ws = null;
        }
        this.backends.splice(index, 1);
        this._saveExtras();
        mergeAndRender();
        updateBackendMenu();
      },

      _saveExtras() {
        // Persist all entries except entry 0 (the main server)
        const urls = this.backends.slice(1).map(e => e.url);
        localStorage.setItem('ccmon-backends', JSON.stringify(urls));
      },
    };

    function mergeAndRender() {
      const merged = BackendManager.backends.flatMap(e =>
        e.projects.map(p => ({ ...p, _backendKey: e.hostname || e.url }))
      );
      render(getSortedProjects(merged));
    }

    function updateStatusPill() {
      const bar = document.getElementById('status-bar');
      const statuses = BackendManager.backends.map(e => e.status);
      const connectedCount = statuses.filter(s => s === 'connected').length;
      const total = statuses.length;

      if (connectedCount === total) {
        bar.textContent = '● Connected';
        bar.style.color = '#22c55e';
      } else if (connectedCount > 0) {
        bar.textContent = '● Partial';
        bar.style.color = '#f59e0b';
      } else {
        bar.textContent = '⟳ Reconnecting...';
        bar.style.color = '#f97316';
      }
    }

    function updateBackendMenu() {
      const list = document.getElementById('backend-list');
      list.innerHTML = '';
      BackendManager.backends.forEach((entry, index) => {
        const row = document.createElement('div');
        row.className = 'backend-row';

        const displayName = entry.hostname || entry.url;
        const showUrl = entry.hostname ? entry.url : null;

        const dotClass = `status-dot status-dot-${entry.status}`;
        const labelClass = `status-label-${entry.status}`;
        const statusText = entry.status === 'connected' ? 'Connected'
          : entry.status === 'connecting' ? 'Connecting...'
          : 'Disconnected';

        row.innerHTML = `
          <div class="backend-info">
            <div class="backend-host" title="${esc(displayName)}">${esc(displayName)}</div>
            ${showUrl ? `<div class="backend-url" title="${esc(entry.url)}">${esc(entry.url)}</div>` : ''}
          </div>
          <div class="backend-status">
            <span class="${dotClass}"></span>
            <span class="${labelClass}">${esc(statusText)}</span>
          </div>
          <button class="remove-btn" ${index === 0 ? 'disabled' : ''} data-index="${index}">Remove</button>
        `;

        row.querySelector('.remove-btn').addEventListener('click', (e) => {
          const idx = parseInt(e.currentTarget.dataset.index, 10);
          BackendManager.removeBackend(idx);
        });

        list.appendChild(row);
      });
    }

    // Settings menu toggle
    const menuEl = document.getElementById('backend-menu');

    function toggleMenu() {
      menuEl.classList.toggle('open');
      if (menuEl.classList.contains('open')) {
        updateBackendMenu();
      }
    }

    document.getElementById('status-bar').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu();
    });

    document.getElementById('settings-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu();
    });

    document.addEventListener('click', (e) => {
      if (menuEl.classList.contains('open') && !menuEl.contains(e.target)) {
        menuEl.classList.remove('open');
      }
    });

    // Add server form
    document.getElementById('add-server-btn').addEventListener('click', () => {
      const input = document.getElementById('add-server-input');
      const errorEl = document.getElementById('add-server-error');
      const url = input.value.trim();

      if (!url.match(/^wss?:\/\/.+/)) {
        errorEl.textContent = 'URL must start with ws:// or wss://';
        errorEl.style.display = 'block';
        return;
      }

      errorEl.style.display = 'none';
      input.value = '';
      BackendManager.addBackend(url);
    });

    document.getElementById('add-server-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('add-server-btn').click();
      }
    });

    BackendManager.init();

    // Refresh relative timestamps (e.g. "2m ago") every 5 seconds without
    // requiring a new WS message. Also detect zombie connections: if a socket
    // is OPEN but no message has arrived in >60s (2× the server's 30s broadcast
    // interval), the connection is stale and must be force-recycled.
    setInterval(() => {
      const now = Date.now();
      for (const entry of BackendManager.backends) {
        if (entry.ws?.readyState === WebSocket.OPEN && now - entry.lastMessageAt > 60_000) {
          entry.ws.onclose = entry.ws.onerror = null;
          entry.ws.close();
          BackendManager._connect(entry);
        }
      }
      mergeAndRender();
    }, 5000);

    // Force-reconnect all backends on page visibility restore (e.g. wake from sleep).
    // Safari may leave a socket in zombie OPEN state without firing onclose, so we
    // close and reconnect proactively rather than waiting for the backoff timer.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      for (const entry of BackendManager.backends) {
        if (entry.ws && entry.ws.readyState === WebSocket.OPEN) {
          entry.ws.onclose = entry.ws.onerror = null;
          entry.ws.close();
        }
        BackendManager._connect(entry);
      }
    });
</script>
</body>
</html>
