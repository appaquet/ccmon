<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ccmon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --running: #22c55e;
      --stopped: #f97316;
      --waiting: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    #status-bar {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color 0.2s;
    }

    main {
      padding: 20px;
    }

    #project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge-running  { background: rgba(34,197,94,0.12);  color: var(--running); }
    .badge-stopped  { background: rgba(249,115,22,0.12); color: var(--stopped); }
    .badge-waiting  { background: rgba(239,68,68,0.12);  color: var(--waiting); }

    .dot-running  { background: var(--running); animation: pulse-dot 1.8s ease-in-out infinite; }
    .dot-stopped  { background: var(--stopped); }
    .dot-waiting  { background: var(--waiting); }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-message {
      font-size: 12px;
      font-style: italic;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0.5rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.75); }
    }

    @keyframes flash-waiting {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--waiting); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    }
    .card-flashing-waiting {
      animation: flash-waiting 1s ease-in-out infinite;
    }

    @keyframes flash-stopped {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--stopped); box-shadow: 0 0 12px rgba(249,115,22,0.5); }
    }
    .card-flashing-stopped {
      animation: flash-stopped 0.5s ease-in-out 10;
    }

    @keyframes flash-notification {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.45); }
    }
    .card-flashing-notification {
      animation: flash-notification 0.5s ease-in-out 10;
    }

    /* Context window progress bar */
    .ctx-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .ctx-bar-container {
      width: 120px;
      flex-shrink: 0;
    }
    .ctx-bar {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }
    .ctx-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--running);
      transition: width 0.3s ease;
    }
    .ctx-fill-warn  { background: #f59e0b; }
    .ctx-fill-danger { background: var(--waiting); }
    .ctx-label {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .ctx-tasks {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Unified agent row */
    .agent-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-dot-active {
      background: var(--running);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    .agent-dot-idle {
      background: var(--muted);
      opacity: 0.5;
    }
    .agent-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .agent-model {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .agent-msg {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 13px;
    }
    .agent-msg-in  { color: #7dd3fc; }
    .agent-msg-out { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>ccmon</h1>
    <div id="status-bar">Connecting...</div>
  </header>
  <main>
    <div id="project-grid"></div>
  </main>
  <script>
    let projects = [];

    const stateLabel = {
      running: 'Running',
      stopped: 'Stopped',
      waiting_for_permission: 'Waiting',
    };

    const stateColor = {
      running: '#22c55e',
      stopped: '#f97316',
      waiting_for_permission: '#ef4444',
    };

    const stateBadgeClass = {
      running: 'badge-running',
      stopped: 'badge-stopped',
      waiting_for_permission: 'badge-waiting',
    };

    const stateDotClass = {
      running: 'dot-running',
      stopped: 'dot-stopped',
      waiting_for_permission: 'dot-waiting',
    };

    function relativeTime(iso) {
      if (!iso) return '';
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function truncate(str, max) {
      if (!str) return '';
      return str.length > max ? str.slice(0, max) + '…' : str;
    }

    function shortModel(model) {
      if (!model) return '';
      const m = model.toLowerCase();
      if (m.includes('opus'))   return 'Opus';
      if (m.includes('sonnet')) return 'Sonnet';
      if (m.includes('haiku'))  return 'Haiku';
      return model;
    }

    function fmtTokens(n) {
      if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
      if (n >= 1000) return `${(n / 1000).toFixed(1)}K`;
      return String(n);
    }

    function renderContextBar(inputTokens, tasksDone, tasksTotal) {
      const MAX_CTX = 128_000;
      const tokens = inputTokens || 0;
      const pct = Math.min(100, Math.round((tokens / MAX_CTX) * 100));
      const fillClass = tokens > 120_000 ? 'ctx-fill ctx-fill-danger'
        : tokens > 100_000 ? 'ctx-fill ctx-fill-warn'
        : 'ctx-fill';
      const label = tokens >= 1000 ? Math.round(tokens / 1000) + 'k' : String(tokens);
      const tasksHtml = tasksTotal > 0
        ? `<span class="ctx-tasks">📋 ${tasksDone}/${tasksTotal}</span>`
        : '';
      return `
        <div class="ctx-row">
          <span>💭</span>
          <div class="ctx-bar-container">
            <div class="ctx-bar">
              <div class="${fillClass}" style="width:${pct}%"></div>
            </div>
          </div>
          <span class="ctx-label">${esc(label)}</span>
          ${tasksHtml}
        </div>
      `;
    }

    function renderAgentRow({ label, model, userActivity, assistantActivity, isActive }) {
      const dotClass = isActive ? 'agent-dot agent-dot-active' : 'agent-dot agent-dot-idle';
      const modelHtml = model
        ? `<span class="agent-model">🤖 ${esc(shortModel(model))}</span>`
        : '';
      let userHtml = '';
      if (userActivity && userActivity.text) {
        userHtml = `<div class="agent-msg agent-msg-in">&gt; ${esc(truncate(userActivity.text, 80))}</div>`;
      }
      let assistantHtml = '';
      if (assistantActivity) {
        const actText = assistantActivity.text ?? assistantActivity.tool;
        if (actText) {
          assistantHtml = `<div class="agent-msg agent-msg-out">&lt; ${esc(truncate(actText, 80))}</div>`;
        }
      }
      return `
        <div class="agent-row">
          <div class="agent-header">
            <span class="${dotClass}"></span>
            <span class="agent-label">${esc(label)}</span>
            ${modelHtml}
          </div>
          ${userHtml}
          ${assistantHtml}
        </div>
      `;
    }

    function createCard(proj, flashStopped, flashNotification) {
      const card = document.createElement('div');
      const s = proj.state || 'stopped';
      const flashClasses = s === 'waiting_for_permission' ? ' card-flashing-waiting'
        : flashStopped ? ' card-flashing-stopped'
        : flashNotification ? ' card-flashing-notification'
        : '';
      card.className = 'card' + flashClasses;

      const badgeClass = stateBadgeClass[s] || 'badge-stopped';
      const dotClass = stateDotClass[s] || 'dot-stopped';
      const label = stateLabel[s] || s;

      // Resolve task counts from tasks array when available, fall back to done/total fields
      let tasksDone = proj.tasksDone || 0;
      let tasksTotal = proj.tasksTotal || 0;
      if (proj.tasks && proj.tasks.length > 0) {
        const nonDeleted = proj.tasks.filter(t => t.status !== 'deleted');
        tasksDone = nonDeleted.filter(t => t.status === 'completed').length;
        tasksTotal = nonDeleted.length;
      }

      let html = `
        <div class="card-header">
          <span class="card-name" title="${esc(proj.projectName)}">${esc(proj.projectName)}</span>
          <span class="badge ${badgeClass}">
            <span class="dot ${dotClass}"></span>
            ${esc(label)}
          </span>
        </div>
      `;

      html += renderContextBar(proj.inputTokens || 0, tasksDone, tasksTotal);

      html += renderAgentRow({
        label: 'Main agent',
        model: proj.model,
        userActivity: proj.latestUserActivity,
        assistantActivity: proj.latestAssistantActivity,
        isActive: s === 'running',
      });

      if (proj.subagents && proj.subagents.length > 0) {
        for (const agent of proj.subagents) {
          const agentLabel = 'Sub: ' + (agent.description ?? agent.agentId);
          html += renderAgentRow({
            label: agentLabel,
            model: agent.model,
            userActivity: agent.latestUserActivity,
            assistantActivity: agent.latestAssistantActivity,
            isActive: agent.isActive,
          });
        }
      }

      card.innerHTML = html;
      return card;
    }

    const prevState = new Map();                // projectName → last known state string
    const prevNotificationTimestamp = new Map(); // projectName → last known notificationTimestamp

    function render() {
      const grid = document.getElementById('project-grid');
      const all = [...projects];
      all.sort((a, b) => a.projectName.localeCompare(b.projectName));

      // Compute running→stopped transitions and new notification arrivals before clearing DOM
      const flashStopped = new Set();
      const flashNotification = new Set();
      for (const proj of all) {
        if (prevState.get(proj.projectName) === 'running' && proj.state === 'stopped') {
          flashStopped.add(proj.projectName);
        }
        prevState.set(proj.projectName, proj.state);

        const prevTs = prevNotificationTimestamp.get(proj.projectName);
        const curTs = proj.notificationTimestamp;
        if (curTs && curTs !== prevTs) {
          flashNotification.add(proj.projectName);
        }
        if (curTs !== undefined) {
          prevNotificationTimestamp.set(proj.projectName, curTs);
        }
      }
      const currentNames = new Set(all.map(p => p.projectName));
      for (const name of [...prevState.keys()]) {
        if (!currentNames.has(name)) prevState.delete(name);
      }
      for (const name of [...prevNotificationTimestamp.keys()]) {
        if (!currentNames.has(name)) prevNotificationTimestamp.delete(name);
      }

      grid.innerHTML = '';

      if (all.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No active projects';
        grid.appendChild(empty);
        return;
      }

      for (const proj of all) {
        grid.appendChild(createCard(
          proj,
          flashStopped.has(proj.projectName),
          flashNotification.has(proj.projectName),
        ));
      }
    }

    function setStatus(s) {
      const bar = document.getElementById('status-bar');
      bar.textContent = s === 'connected' ? '● Connected' : '⟳ Reconnecting...';
      bar.style.color = s === 'connected' ? '#22c55e' : '#f97316';
    }

    let backoff = 1000;

    function connectWebSocket() {
      const ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = () => {
        backoff = 1000;
        setStatus('connected');
      };

      ws.onmessage = (e) => {
        try {
          projects = JSON.parse(e.data);
          render();
        } catch (err) {
          console.error('Failed to parse WebSocket message:', err);
        }
      };

      ws.onclose = ws.onerror = () => {
        setStatus('reconnecting');
        setTimeout(connectWebSocket, backoff);
        backoff = Math.min(backoff * 2, 30000);
      };
    }

    connectWebSocket();

    // Refresh relative timestamps (e.g. "2m ago") every 5 seconds without
    // requiring a new WS message.
    setInterval(render, 5000);
  </script>
</body>
</html>
