<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ccmon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --running: #22c55e;
      --stopped: #f97316;
      --waiting: #ef4444;
      --closed: #6b7280;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }

    #status-bar {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: color 0.2s;
      cursor: pointer;
      user-select: none;
    }

    #status-bar:hover {
      background: rgba(255,255,255,0.08);
    }

    #settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    #settings-btn:hover {
      background: rgba(255,255,255,0.10);
      color: var(--text);
    }

    #backend-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      padding: 8px 0;
    }

    #backend-menu.open {
      display: block;
    }

    .menu-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 14px 4px;
    }

    .backend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
    }

    .backend-info {
      flex: 1;
      min-width: 0;
    }

    .backend-host {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backend-url {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backend-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot-connected    { background: var(--running); }
    .status-dot-connecting   { background: var(--stopped); }
    .status-dot-disconnected { background: var(--waiting); }

    .status-label-connected    { color: var(--running); }
    .status-label-connecting   { color: var(--stopped); }
    .status-label-disconnected { color: var(--muted); }

    .remove-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .remove-btn:hover:not(:disabled) {
      background: rgba(239,68,68,0.12);
      color: var(--waiting);
      border-color: var(--waiting);
    }

    .remove-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .menu-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }

    .add-server-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
    }

    #add-server-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    #add-server-input:focus {
      border-color: var(--muted);
    }

    #add-server-input::placeholder {
      color: var(--muted);
    }

    #add-server-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    #add-server-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    #add-server-error {
      font-size: 11px;
      color: var(--waiting);
      padding: 0 14px 6px;
      display: none;
    }

    main {
      padding: 20px;
    }

    #project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      width: 100%;
      max-width: 480px;
    }

    .card-hide {
      position: absolute;
      /* The 14px row gap contains the focus outline while clearing card identity content. */
      top: -10px;
      right: 8px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    }

    .card:hover .card-hide,
    .card-hide:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .card-hide:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .card-hide:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 0;
    }

    .card-agents {
      overflow: hidden;
      max-height: 300px;
    }

    .card-identity {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .card-header {
      display: grid;
      grid-template-columns: max-content minmax(0, 3fr) minmax(0, 2fr);
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .card-project,
    .card-host,
    .card-session {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .card-project {
      font-size: 14px;
      font-weight: 600;
    }

    .card-host {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .card-session {
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .badge-running  { background: rgba(34,197,94,0.12);  color: var(--running); }
    .badge-stopped  { background: rgba(249,115,22,0.12); color: var(--stopped); }
    .badge-waiting  { background: rgba(239,68,68,0.12);  color: var(--waiting); }
    .badge-closed   { background: rgba(107,114,128,0.12); color: var(--closed); border: 1px solid rgba(107,114,128,0.18); }

    .dot-running  { background: var(--running); animation: pulse-dot 1.8s ease-in-out infinite; }
    .dot-stopped  { background: var(--stopped); }
    .dot-waiting  { background: var(--waiting); }
    .dot-closed   { background: var(--closed); }

    .card-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-message {
      font-size: 12px;
      font-style: italic;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.75); }
    }

    @keyframes flash-waiting {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--waiting); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    }
    .card-flashing-waiting {
      animation: flash-waiting 1s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes flash-error {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--waiting); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    }
    .card-flashing-error {
      animation: flash-error 1s ease-in-out infinite;
      cursor: pointer;
    }

    @keyframes flash-stopped {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: var(--stopped); box-shadow: 0 0 12px rgba(249,115,22,0.5); }
    }
    .card-flashing-stopped {
      animation: flash-stopped 0.5s ease-in-out 10;
    }

    @keyframes flash-notification {
      0%, 100% { border-color: var(--border); }
      50%       { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245,158,11,0.45); }
    }
    .card-flashing-notification {
      animation: flash-notification 0.5s ease-in-out 10;
    }

    /* Context window progress bar */
    .ctx-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .ctx-bar-container {
      width: 120px;
      flex-shrink: 0;
    }
    .ctx-bar {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }
    .ctx-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--running);
      transition: width 0.3s ease;
    }
    .ctx-fill-warn  { background: #f59e0b; }
    .ctx-fill-danger { background: var(--waiting); }
    .ctx-label {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .ctx-tasks {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Unified agent row */
    .agent-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 0;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-dot-active {
      background: var(--running);
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    .agent-dot-idle {
      background: var(--muted);
      opacity: 0.5;
    }
    .agent-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .agent-model {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .agent-msg {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 13px;
    }
    .agent-msg-in  { color: #7dd3fc; }
    .agent-msg-out { color: #94a3b8; }
  </style>
</head>
<body>
  <header>
    <h1>ccmon</h1>
    <div id="header-right">
      <div id="status-bar">Connecting...</div>
      <div id="settings-btn" title="Manage servers">⚙</div>
      <div id="backend-menu">
        <div class="menu-section-label">Backends</div>
        <div id="backend-list"></div>
        <div class="menu-divider"></div>
        <div class="add-server-row">
          <input id="add-server-input" type="text" placeholder="ws://host:port/ws" />
          <button id="add-server-btn">Add</button>
        </div>
        <div id="add-server-error"></div>
      </div>
    </div>
  </header>
  <main>
    <div id="project-grid"></div>
  </main>
  <script src="js/utils.js"></script>
  <script src="js/render.js"></script>
  <script src="js/backend-manager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
